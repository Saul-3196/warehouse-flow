server:
  port: 8081

spring:
  application:
    name: warehouse-flow
  datasource:
    url: jdbc:postgresql://localhost:5433/warehouse_db
    username: warehouse_user
    password: warehouse_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true