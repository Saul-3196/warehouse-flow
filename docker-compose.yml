services:
  postgres:
    image: postgres:16-alpine
    container_name: warehouse-postgres
    restart: always
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_pass
    ports:
      - "5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data

volumes:
  warehouse_data: